# Streamlit configuration for local runs and Streamlit Community Cloud.
# Only public, non-secret settings belong in this file.

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#1c2530"

[browser]
# No telemetry from this demonstration app.
gatherUsageStats = false

[server]
headless = true
